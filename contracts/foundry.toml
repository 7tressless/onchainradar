[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Mantle networks. RPC endpoints sourced from official Mantle docs:
#   mainnet  https://rpc.mantle.xyz          (chainId 5000)
#   sepolia  https://rpc.sepolia.mantle.xyz  (chainId 5003)
[rpc_endpoints]
mantle = "${MANTLE_RPC_URL}"
mantle_sepolia = "${MANTLE_SEPOLIA_RPC_URL}"

# MantleScan verification (Etherscan-compatible). Set the API key in the env.
[etherscan]
mantle = { key = "${MANTLESCAN_API_KEY}", chain = 5000, url = "https://api.mantlescan.xyz/api" }
mantle_sepolia = { key = "${MANTLESCAN_API_KEY}", chain = 5003, url = "https://api-sepolia.mantlescan.xyz/api" }
